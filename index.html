<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase 数据同步测试</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 统一的 Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3ECF8E',
                        secondary: '#1E40AF',
                        accent: '#F97316',
                        neutral: '#64748B',
                        'base-100': '#FFFFFF',
                        info: '#3ABFF8',
                        success: '#36D399',
                        warning: '#FBBD23',
                        error: '#F87272',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .transition-all-300 {
                transition: all 300ms ease-in-out;
            }
            .shadow-hover {
                @apply transition-all-300 hover:shadow-lg hover:-translate-y-1;
            }
            .btn {
                @apply px-4 py-2 rounded-md font-medium transition-all-300 focus:outline-none focus:ring-2 focus:ring-offset-2;
            }
            .btn-primary {
                @apply bg-primary text-white hover:bg-primary/90 focus:ring-primary/50;
            }
            .btn-secondary {
                @apply bg-secondary text-white hover:bg-secondary/90 focus:ring-secondary/50;
            }
            .btn-accent {
                @apply bg-accent text-white hover:bg-accent/90 focus:ring-accent/50;
            }
            .btn-outline {
                @apply border border-gray-300 text-gray-700 hover:bg-gray-50 focus:ring-gray-500/50;
            }
            .input-field {
                @apply w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary;
            }
            .card {
                @apply bg-white rounded-lg shadow-md overflow-hidden;
            }
            .badge {
                @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium;
            }
            .badge-success {
                @apply bg-success/20 text-success;
            }
            .badge-error {
                @apply bg-error/20 text-error;
            }
            .badge-warning {
                @apply bg-warning/20 text-warning;
            }
            .badge-info {
                @apply bg-info/20 text-info;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- 头部 -->
        <header class="mb-8">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">Supabase 数据同步测试</h1>
                    <p class="mt-1 text-sm text-gray-600">测试实时数据同步功能，包括增删改查和实时监听</p>
                </div>
                <div class="mt-4 md:mt-0">
                    <div class="flex items-center space-x-2">
                        <div id="connection-status" class="badge badge-warning">
                            <span class="mr-1"><i class="fa fa-circle-o-notch fa-spin"></i></span>
                            连接中...
                        </div>
                        <button id="refresh-btn" class="btn btn-outline text-sm">
                            <i class="fa fa-refresh mr-1"></i> 刷新数据
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- 主内容区 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 左侧：添加数据表单 -->
            <div class="card p-6">
                <h2 class="text-xl font-semibold text-gray-900 mb-4">添加数据</h2>
                <form id="add-form" class="space-y-4">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">名称</label>
                        <input type="text" id="name" name="name" class="input-field" placeholder="请输入名称" required>
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
                        <input type="email" id="email" name="email" class="input-field" placeholder="请输入邮箱" required>
                    </div>
                    <div>
                        <label for="message" class="block text-sm font-medium text-gray-700 mb-1">消息</label>
                        <textarea id="message" name="message" rows="3" class="input-field" placeholder="请输入消息内容"></textarea>
                    </div>
                    <div class="flex justify-end">
                        <button type="submit" class="btn btn-primary">
                            <i class="fa fa-plus mr-1"></i> 添加数据
                        </button>
                    </div>
                </form>
            </div>

            <!-- 中间：数据列表 -->
            <div class="lg:col-span-2">
                <div class="card">
                    <div class="p-6 border-b border-gray-200">
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between">
                            <h2 class="text-xl font-semibold text-gray-900">数据列表</h2>
                            <div class="mt-3 sm:mt-0 flex items-center">
                                <div class="relative">
                                    <input type="text" id="search-input" class="input-field pr-10" placeholder="搜索...">
                                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                                        <i class="fa fa-search text-gray-400"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left text-gray-500">
                            <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                                <tr>
                                    <th scope="col" class="px-6 py-3">ID</th>
                                    <th scope="col" class="px-6 py-3">名称</th>
                                    <th scope="col" class="px-6 py-3">邮箱</th>
                                    <th scope="col" class="px-6 py-3">消息</th>
                                    <th scope="col" class="px-6 py-3">创建时间</th>
                                    <th scope="col" class="px-6 py-3">状态</th>
                                    <th scope="col" class="px-6 py-3">操作</th>
                                </tr>
                            </thead>
                            <tbody id="data-table-body">
                                <!-- 数据将通过 JavaScript 动态填充 -->
                                <tr class="bg-white border-b">
                                    <td colspan="7" class="px-6 py-4 text-center text-gray-500">
                                        <div class="flex items-center justify-center">
                                            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary mr-2"></div>
                                            加载中...
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="pagination" class="p-4 border-t border-gray-200 flex items-center justify-between">
                        <div class="text-sm text-gray-700">
                            显示 <span id="showing-records">0</span> 条记录
                        </div>
                        <div class="flex space-x-2">
                            <button id="prev-page" class="btn btn-outline text-sm" disabled>
                                <i class="fa fa-chevron-left mr-1"></i> 上一页
                            </button>
                            <button id="next-page" class="btn btn-outline text-sm" disabled>
                                下一页 <i class="fa fa-chevron-right ml-1"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 实时事件日志 -->
        <div class="mt-8">
            <div class="card">
                <div class="p-6 border-b border-gray-200">
                    <div class="flex items-center justify-between">
                        <h2 class="text-xl font-semibold text-gray-900">实时事件日志</h2>
                        <button id="clear-log" class="btn btn-outline text-sm">
                            <i class="fa fa-trash mr-1"></i> 清空日志
                        </button>
                    </div>
                </div>
                <div id="event-log" class="p-4 h-64 overflow-y-auto bg-gray-50 text-sm font-mono">
                    <div class="text-gray-500 italic">等待实时事件...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑模态框 -->
    <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
            <div class="p-6 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-semibold text-gray-900">编辑数据</h3>
                    <button id="close-modal" class="text-gray-400 hover:text-gray-500">
                        <i class="fa fa-times"></i>
                    </button>
                </div>
            </div>
            <form id="edit-form" class="p-6 space-y-4">
                <input type="hidden" id="edit-id">
                <div>
                    <label for="edit-name" class="block text-sm font-medium text-gray-700 mb-1">名称</label>
                    <input type="text" id="edit-name" name="name" class="input-field" placeholder="请输入名称" required>
                </div>
                <div>
                    <label for="edit-email" class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
                    <input type="email" id="edit-email" name="email" class="input-field" placeholder="请输入邮箱" required>
                </div>
                <div>
                    <label for="edit-message" class="block text-sm font-medium text-gray-700 mb-1">消息</label>
                    <textarea id="edit-message" name="message" rows="3" class="input-field" placeholder="请输入消息内容"></textarea>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" id="cancel-edit" class="btn btn-outline">取消</button>
                    <button type="submit" class="btn btn-primary">保存更改</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 初始化 Supabase 客户端
        const SUPABASE_URL = 'https://ghoqxmbjymjbcvrfeagn.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_GkPvZGm__fPkfqhRsIbx7w_k09HBr_8';
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
        
        // 全局变量
        let currentPage = 1;
        const pageSize = 10;
        let totalRecords = 0;
        let searchQuery = '';
        let dataChannel = null;
        let presenceChannel = null;
        let onlineUsers = 0;
        
        // DOM 元素
        const connectionStatus = document.getElementById('connection-status');
        const dataTableBody = document.getElementById('data-table-body');
        const showingRecords = document.getElementById('showing-records');
        const prevPageBtn = document.getElementById('prev-page');
        const nextPageBtn = document.getElementById('next-page');
        const searchInput = document.getElementById('search-input');
        const addForm = document.getElementById('add-form');
        const editForm = document.getElementById('edit-form');
        const editModal = document.getElementById('edit-modal');
        const closeModalBtn = document.getElementById('close-modal');
        const cancelEditBtn = document.getElementById('cancel-edit');
        const refreshBtn = document.getElementById('refresh-btn');
        const eventLog = document.getElementById('event-log');
        const clearLogBtn = document.getElementById('clear-log');
        
        // 初始化函数
        async function init() {
            try {
                // 检查连接状态
                await checkConnection();
                
                // 初始化实时通道
                initRealtimeChannels();
                
                // 加载初始数据
                await loadData();
                
                // 设置事件监听器
                setupEventListeners();
                
                // 更新连接状态
                updateConnectionStatus('connected');
            } catch (error) {
                console.error('初始化失败:', error);
                updateConnectionStatus('error', error.message);
                logEvent('初始化失败: ' + error.message, 'error');
            }
        }
        
        // 检查连接状态
        async function checkConnection() {
            try {
                await supabase.from('test_data').select('id').limit(1);
                return true;
            } catch (error) {
                throw new Error('无法连接到 Supabase: ' + error.message);
            }
        }
        
        // 初始化实时通道
        function initRealtimeChannels() {
            try {
                // 创建数据变更通道
                dataChannel = supabase.channel('test_data_channel');
                
                // 监听数据变更
                dataChannel
                    .on('postgres_changes', { 
                        event: '*', 
                        schema: 'public', 
                        table: 'test_data' 
                    }, handleDataChange)
                    .subscribe(status => {
                        if (status === 'SUBSCRIBED') {
                            logEvent('数据变更监听已启动', 'success');
                        } else if (status === 'CHANNEL_ERROR') {
                            logEvent('数据变更监听失败', 'error');
                        }
                    });
                
                // 创建在线状态通道
                presenceChannel = supabase.channel('online_users', {
                    config: {
                        presence: {
                            key: `user_${Math.random().toString(36).substr(2, 9)}`
                        }
                    }
                });
                
                // 监听在线状态
                presenceChannel
                    .on('presence', { event: 'sync' }, handlePresenceSync)
                    .on('presence', { event: 'join' }, ({ key, newPresences }) => {
                        logEvent(`用户 ${key} 已上线`, 'info');
                        updateOnlineUsers();
                    })
                    .on('presence', { event: 'leave' }, ({ key, leftPresences }) => {
                        logEvent(`用户 ${key} 已下线`, 'info');
                        updateOnlineUsers();
                    })
                    .subscribe(async status => {
                        if (status === 'SUBSCRIBED') {
                            // 跟踪当前用户
                            await presenceChannel.track({
                                online_at: new Date().toISOString(),
                                user_agent: navigator.userAgent
                            });
                            logEvent('在线状态监听已启动', 'success');
                        }
                    });
                
            } catch (error) {
                console.error('初始化实时通道失败:', error);
                logEvent('初始化实时通道失败: ' + error.message, 'error');
            }
        }
        
        // 处理数据变更
        function handleDataChange(payload) {
            const { eventType, new, old } = payload;
            
            // 记录事件
            let message = '';
            switch (eventType) {
                case 'INSERT':
                    message = `新增数据: ID ${new.id}, 名称 ${new.name}`;
                    break;
                case 'UPDATE':
                    message = `更新数据: ID ${old.id}, 名称从 "${old.name}" 改为 "${new.name}"`;
                    break;
                case 'DELETE':
                    message = `删除数据: ID ${old.id}, 名称 ${old.name}`;
                    break;
                default:
                    message = `未知事件: ${eventType}`;
            }
            
            logEvent(message, eventType.toLowerCase());
            
            // 重新加载数据
            loadData();
        }
        
        // 处理在线状态同步
        function handlePresenceSync() {
            updateOnlineUsers();
            logEvent('在线状态已同步', 'info');
        }
        
        // 更新在线用户数
        function updateOnlineUsers() {
            if (presenceChannel) {
                const state = presenceChannel.presenceState();
                onlineUsers = Object.keys(state).length;
                document.title = `Supabase 数据同步测试 (${onlineUsers} 人在线)`;
                
                // 更新连接状态显示
                const statusText = connectionStatus.querySelector('span:last-child');
                if (statusText) {
                    statusText.textContent = `已连接 (${onlineUsers} 人在线)`;
                }
            }
        }
        
        // 加载数据
        async function loadData(resetPagination = false) {
            if (resetPagination) {
                currentPage = 1;
            }
            
            try {
                // 显示加载状态
                showLoadingState();
                
                // 构建查询
                let query = supabase.from('test_data').select('*', { count: 'exact' });
                
                // 添加搜索条件
                if (searchQuery) {
                    query = query.or(
                        `name.ilike.%${searchQuery}%,email.ilike.%${searchQuery}%,message.ilike.%${searchQuery}%`
                    );
                }
                
                // 添加分页
                const { data, error, count } = await query
                    .order('created_at', { ascending: false })
                    .range((currentPage - 1) * pageSize, currentPage * pageSize - 1);
                
                if (error) {
                    throw error;
                }
                
                // 更新总记录数
                totalRecords = count || 0;
                
                // 渲染数据
                renderData(data);
                
                // 更新分页
                updatePagination();
                
                // 更新显示记录数
                updateShowingRecords(data.length);
                
            } catch (error) {
                console.error('加载数据失败:', error);
                logEvent('加载数据失败: ' + error.message, 'error');
                showErrorState('加载数据失败，请稍后重试');
            }
        }
        
        // 渲染数据
        function renderData(data) {
            if (!data || data.length === 0) {
                dataTableBody.innerHTML = `
                    <tr class="bg-white border-b">
                        <td colspan="7" class="px-6 py-4 text-center text-gray-500">
                            暂无数据
                        </td>
                    </tr>
                `;
                return;
            }
            
            dataTableBody.innerHTML = data.map(item => `
                <tr class="bg-white border-b hover:bg-gray-50">
                    <td class="px-6 py-4 font-medium text-gray-900">${item.id}</td>
                    <td class="px-6 py-4">${escapeHtml(item.name)}</td>
                    <td class="px-6 py-4">${escapeHtml(item.email)}</td>
                    <td class="px-6 py-4">${item.message ? escapeHtml(item.message.substring(0, 50)) + (item.message.length > 50 ? '...' : '') : ''}</td>
                    <td class="px-6 py-4 text-gray-500">${formatDate(item.created_at)}</td>
                    <td class="px-6 py-4">
                        <span class="badge badge-success">
                            <i class="fa fa-check-circle mr-1"></i> 正常
                        </span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex space-x-2">
                            <button class="btn-edit text-blue-600 hover:text-blue-900" data-id="${item.id}">
                                <i class="fa fa-pencil"></i>
                            </button>
                            <button class="btn-delete text-red-600 hover:text-red-900" data-id="${item.id}">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
            
            // 添加编辑和删除按钮事件
            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', () => editData(btn.dataset.id));
            });
            
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', () => deleteData(btn.dataset.id));
            });
        }
        
        // 显示加载状态
        function showLoadingState() {
            dataTableBody.innerHTML = `
                <tr class="bg-white border-b">
                    <td colspan="7" class="px-6 py-4 text-center text-gray-500">
                        <div class="flex items-center justify-center">
                            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary mr-2"></div>
                            加载中...
                        </div>
                    </td>
                </tr>
            `;
        }
        
        // 显示错误状态
        function showErrorState(message) {
            dataTableBody.innerHTML = `
                <tr class="bg-white border-b">
                    <td colspan="7" class="px-6 py-4 text-center text-red-500">
                        <div class="flex items-center justify-center">
                            <i class="fa fa-exclamation-circle mr-2"></i>
                            ${message}
                        </div>
                    </td>
                </tr>
            `;
        }
        
        // 更新分页
        function updatePagination() {
            const totalPages = Math.ceil(totalRecords / pageSize);
            
            prevPageBtn.disabled = currentPage === 1;
            nextPageBtn.disabled = currentPage === totalPages || totalPages === 0;
            
            prevPageBtn.classList.toggle('opacity-50', prevPageBtn.disabled);
            nextPageBtn.classList.toggle('opacity-50', nextPageBtn.disabled);
        }
        
        // 更新显示记录数
        function updateShowingRecords(currentCount) {
            const start = totalRecords === 0 ? 0 : (currentPage - 1) * pageSize + 1;
            const end = Math.min(currentPage * pageSize, totalRecords);
            
            showingRecords.textContent = totalRecords === 0 ? '0' : `${start} - ${end} / ${totalRecords}`;
        }
        
        // 添加数据
        async function addData(formData) {
            try {
                const { data, error } = await supabase
                    .from('test_data')
                    .insert([{
                        name: formData.get('name'),
                        email: formData.get('email'),
                        message: formData.get('message') || null
                    }]);
                
                if (error) {
                    throw error;
                }
                
                logEvent(`成功添加数据: ID ${data[0].id}`, 'success');
                
                // 重置表单
                addForm.reset();
                
                // 重新加载数据
                await loadData(true);
                
                return true;
            } catch (error) {
                console.error('添加数据失败:', error);
                logEvent('添加数据失败: ' + error.message, 'error');
                throw error;
            }
        }
        
        // 获取单条数据
        async function getDataById(id) {
            try {
                const { data, error } = await supabase
                    .from('test_data')
                    .select('*')
                    .eq('id', id)
                    .single();
                
                if (error) {
                    throw error;
                }
                
                return data;
            } catch (error) {
                console.error('获取数据失败:', error);
                logEvent('获取数据失败: ' + error.message, 'error');
                throw error;
            }
        }
        
        // 编辑数据
        async function editData(id) {
            try {
                // 获取数据
                const data = await getDataById(id);
                
                // 填充表单
                document.getElementById('edit-id').value = data.id;
                document.getElementById('edit-name').value = data.name;
                document.getElementById('edit-email').value = data.email;
                document.getElementById('edit-message').value = data.message || '';
                
                // 显示模态框
                editModal.classList.remove('hidden');
                
                logEvent(`准备编辑数据: ID ${id}`, 'info');
            } catch (error) {
                alert('无法加载编辑数据: ' + error.message);
            }
        }
        
        // 更新数据
        async function updateData(formData) {
            try {
                const id = formData.get('id');
                
                const { data, error } = await supabase
                    .from('test_data')
                    .update({
                        name: formData.get('name'),
                        email: formData.get('email'),
                        message: formData.get('message') || null
                    })
                    .eq('id', id)
                    .select();
                
                if (error) {
                    throw error;
                }
                
                logEvent(`成功更新数据: ID ${id}`, 'success');
                
                // 关闭模态框
                closeModal();
                
                // 重新加载数据
                await loadData();
                
                return true;
            } catch (error) {
                console.error('更新数据失败:', error);
                logEvent('更新数据失败: ' + error.message, 'error');
                throw error;
            }
        }
        
        // 删除数据
        async function deleteData(id) {
            if (!confirm('确定要删除这条数据吗？')) {
                return;
            }
            
            try {
                const { error } = await supabase
                    .from('test_data')
                    .delete()
                    .eq('id', id);
                
                if (error) {
                    throw error;
                }
                
                logEvent(`成功删除数据: ID ${id}`, 'success');
                
                // 重新加载数据
                await loadData();
                
                return true;
            } catch (error) {
                console.error('删除数据失败:', error);
                logEvent('删除数据失败: ' + error.message, 'error');
                alert('删除数据失败: ' + error.message);
            }
        }
        
        // 关闭模态框
        function closeModal() {
            editModal.classList.add('hidden');
            editForm.reset();
        }
        
        // 更新连接状态显示
        function updateConnectionStatus(status, message = '') {
            connectionStatus.className = 'badge';
            
            switch (status) {
                case 'connected':
                    connectionStatus.classList.add('badge-success');
                    connectionStatus.innerHTML = '<span class="mr-1"><i class="fa fa-check-circle"></i></span> 已连接';
                    break;
                case 'connecting':
                    connectionStatus.classList.add('badge-warning');
                    connectionStatus.innerHTML = '<span class="mr-1"><i class="fa fa-circle-o-notch fa-spin"></i></span> 连接中...';
                    break;
                case 'error':
                    connectionStatus.classList.add('badge-error');
                    connectionStatus.innerHTML = `<span class="mr-1"><i class="fa fa-exclamation-circle"></i></span> 连接错误`;
                    if (message) {
                        logEvent('连接错误: ' + message, 'error');
                    }
                    break;
                default:
                    connectionStatus.classList.add('badge-info');
                    connectionStatus.innerHTML = `<span class="mr-1"><i class="fa fa-info-circle"></i></span> ${status}`;
            }
        }
        
        // 记录事件
        function logEvent(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = 'mb-1';
            
            let iconClass = 'fa-info-circle';
            let textClass = 'text-gray-700';
            
            switch (type) {
                case 'success':
                    iconClass = 'fa-check-circle';
                    textClass = 'text-green-700';
                    break;
                case 'error':
                    iconClass = 'fa-exclamation-circle';
                    textClass = 'text-red-700';
                    break;
                case 'warning':
                    iconClass = 'fa-exclamation-triangle';
                    textClass = 'text-yellow-700';
                    break;
                case 'info':
                    iconClass = 'fa-info-circle';
                    textClass = 'text-blue-700';
                    break;
                case 'insert':
                    iconClass = 'fa-plus-circle';
                    textClass = 'text-green-700';
                    break;
                case 'update':
                    iconClass = 'fa-pencil';
                    textClass = 'text-blue-700';
                    break;
                case 'delete':
                    iconClass = 'fa-trash';
                    textClass = 'text-red-700';
                    break;
            }
            
            logEntry.innerHTML = `
                <span class="text-gray-500">[${timestamp}]</span>
                <span class="ml-2 ${textClass}">
                    <i class="fa ${iconClass} mr-1"></i> ${escapeHtml(message)}
                </span>
            `;
            
            // 清空初始提示
            if (eventLog.querySelector('.italic')) {
                eventLog.innerHTML = '';
            }
            
            // 添加到日志顶部
            eventLog.insertBefore(logEntry, eventLog.firstChild);
            
            // 限制日志条目数量
            const maxEntries = 100;
            const entries = eventLog.querySelectorAll('div');
            if (entries.length > maxEntries) {
                entries[entries.length - 1].remove();
            }
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            // 搜索
            searchInput.addEventListener('input', debounce(async () => {
                searchQuery = searchInput.value.trim();
                await loadData(true);
            }, 300));
            
            // 添加表单提交
            addForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                try {
                    await addData(new FormData(addForm));
                } catch (error) {
                    alert('添加数据失败: ' + error.message);
                }
            });
            
            // 编辑表单提交
            editForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                try {
                    const formData = new FormData();
                    formData.append('id', document.getElementById('edit-id').value);
                    formData.append('name', document.getElementById('edit-name').value);
                    formData.append('email', document.getElementById('edit-email').value);
                    formData.append('message', document.getElementById('edit-message').value);
                    
                    await updateData(formData);
                } catch (error) {
                    alert('更新数据失败: ' + error.message);
                }
            });
            
            // 关闭模态框
            closeModalBtn.addEventListener('click', closeModal);
            cancelEditBtn.addEventListener('click', closeModal);
            
            // 点击模态框背景关闭
            editModal.addEventListener('click', (e) => {
                if (e.target === editModal) {
                    closeModal();
                }
            });
            
            // 分页按钮
            prevPageBtn.addEventListener('click', async () => {
                if (currentPage > 1) {
                    currentPage--;
                    await loadData();
                }
            });
            
            nextPageBtn.addEventListener('click', async () => {
                const totalPages = Math.ceil(totalRecords / pageSize);
                if (currentPage < totalPages) {
                    currentPage++;
                    await loadData();
                }
            });
            
            // 刷新按钮
            refreshBtn.addEventListener('click', async () => {
                refreshBtn.disabled = true;
                refreshBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-1"></i> 刷新中...';
                
                try {
                    await loadData(true);
                    logEvent('手动刷新数据', 'info');
                } finally {
                    refreshBtn.disabled = false;
                    refreshBtn.innerHTML = '<i class="fa fa-refresh mr-1"></i> 刷新数据';
                }
            });
            
            // 清空日志
            clearLogBtn.addEventListener('click', () => {
                eventLog.innerHTML = '<div class="text-gray-500 italic">日志已清空</div>';
                logEvent('日志已清空', 'info');
            });
            
            // 窗口关闭时清理
            window.addEventListener('beforeunload', () => {
                if (dataChannel) {
                    supabase.removeChannel(dataChannel);
                }
                if (presenceChannel) {
                    supabase.removeChannel(presenceChannel);
                }
            });
        }
        
        // 工具函数：格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
        
        // 工具函数：转义 HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 工具函数：防抖
        function debounce(func, wait) {
            let timeout;
            return function() {
                const context = this;
                const args = arguments;
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    func.apply(context, args);
                }, wait);
            };
        }
        
        // 启动应用
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
